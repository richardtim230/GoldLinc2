<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Assignments | Gold and Linc Schools</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.86">
  <!-- Inter Font + FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --bg-0: #f6f8ff;
      --bg-1: #eef2ff;
      --accent: #3b82f6;
      --accent-2: #6366f1;
      --muted: #6b7280;
      --card-bg: #ffffff;
      --radius: 12px;
      --sidebar-w: 300px;
      --shadow: 0 8px 20px rgba(11, 42, 60, 0.04);
      --shadow-hover: 0 12px 32px rgba(59, 130, 246, 0.08);
      --text-main: #0b2a44;
      --text-muted: #7a90b3;
      --primary: #2647a6;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', system-ui, Arial;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(180deg, var(--bg-0), var(--bg-1));
      color: var(--text-main);
      width: 100vw;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* App layout */
    .app {
      display: flex;
      min-height: 100vh;
      align-items: stretch;
      width: 100vw;
      max-width: 100vw;
      overflow-x: hidden;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.45);
      z-index: 50;
      display: none;
    }

    .overlay.visible {
      display: block;
    }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: linear-gradient(180deg, #0f172a 0%, #1e3a8a 100%);
      color: #fff;
      padding: 20px 16px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      box-shadow: 4px 0 28px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      will-change: transform;
    }

    .sidebar.hidden {
      transform: translateX(-110%);
      transition: transform 0.28s ease;
    }

    .sidebar.open {
      transform: translateX(0);
      transition: transform 0.28s ease;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      border: 3px solid rgba(255, 224, 102, 0.12);
      background: #fff;
    }

    .brand .title {
      font-weight: 700;
      font-size: 1.18rem;
      color: #ffe066;
    }

    .brand .subtitle {
      font-size: 0.96rem;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Nav */
    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      color: #e6eefc;
      background: transparent;
      transition: background 0.12s, transform 0.08s;
      touch-action: manipulation;
      cursor: pointer;
    }

    .nav a.active,
    .nav a:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #ffe066;
      transform: translateX(3px);
    }

    .spacer {
      flex: 1;
    }

    .profile {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .profile img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #ffe066;
    }

    .profile .name {
      font-weight: 700;
      font-size: 1.02rem;
      color: #ffe066;
    }

    .profile .muted {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.92rem;
    }

    /* MAIN CONTENT */
    .main {
      margin-left: var(--sidebar-w);
      padding: 20px;
      flex: 1;
      transition: margin-left 0.28s;
      min-height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      max-width: calc(100vw - var(--sidebar-w));
      box-sizing: border-box;
      overflow-x: hidden;
      padding-top: 90px;
    }

    .main.full {
      margin-left: 0;
      max-width: 100vw;
    }

    /* TOPBAR */
    .topbar {
      position: fixed;
      left: var(--sidebar-w);
      top: 0;
      width: calc(100vw - var(--sidebar-w));
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      backdrop-filter: blur(6px);
      background: rgba(255, 255, 255, 0.86);
      border-bottom: 1px solid rgba(11, 42, 60, 0.06);
      box-shadow: 0 6px 18px rgba(11, 42, 60, 0.04);
      min-height: 64px;
      max-width: 100%;
      box-sizing: border-box;
    }

    .topbar .hamburger {
      display: none;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .topbar .page-title {
      font-weight: 800;
      font-size: 1.18rem;
      color: var(--accent-2);
    }

    .topbar .small {
      font-size: 0.92rem;
      color: var(--muted);
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(11, 42, 60, 0.03);
      width: 100%;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .card-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Table Styles */
    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    thead {
      background: #f8faff;
      border-bottom: 2px solid #eef3ff;
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    tbody tr {
      border-bottom: 1px solid #eef3ff;
      transition: background 0.12s ease;
    }

    tbody tr:hover {
      background: #f9fbff;
    }

    td {
      padding: 14px 16px;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    /* Badge */
    .badge {
      display: inline-block;
      border-radius: 9999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-right: 0.2em;
    }

    .badge-pending { background: #e9f0fe; color: #2647a6; }
    .badge-completed { background: #18ba89; color: #fff; }
    .badge-overdue { background: #e74c3c; color: #fff; }
    .badge-reviewed { background: #ffd600; color: #22305a; }

    /* Buttons */
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .btn.ghost {
      background: transparent;
      color: var(--accent-2);
      border: 1px solid rgba(59, 130, 246, 0.08);
    }

    .btn.ghost:hover {
      background: rgba(59, 130, 246, 0.04);
    }

    .btn.success {
      background: linear-gradient(90deg, #10b981, #059669);
    }

    .action-link {
      color: var(--accent);
      cursor: pointer;
      font-weight: 700;
      transition: color 0.12s ease;
    }

    .action-link:hover {
      color: var(--accent-2);
      text-decoration: underline;
    }

    .action-link.success {
      color: #18ba89;
    }

    /* Modal Styles */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: #ffffff;
      width: 600px;
      max-width: 95vw;
      max-height: 85vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
    }

    .modal-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eef3ff;
      background: #f8faff;
    }

    .modal-title {
      font-weight: 800;
      font-size: 1.18rem;
      color: var(--text-main);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: #64748b;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.12s ease;
    }

    .modal-close:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid #eef3ff;
      background: #f8faff;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* CBT Modal */
    .cbt-modal {
      background: #fff;
      border-radius: 16px;
      max-width: 700px;
      width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
      padding: 24px;
      position: relative;
      animation: cbtmodalin 0.2s;
    }

    @keyframes cbtmodalin {
      from { transform: scale(0.96) translateY(35px); opacity: 0.3; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .cbt-timer {
      font-weight: bold;
      color: #18308b;
      background: #e9f0fe;
      border-radius: 0.6em;
      padding: 6px 16px;
      font-size: 1.1em;
      display: inline-block;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .cbt-q-block {
      border-radius: 12px;
      background: #f7fafd;
      border: 1.5px solid #e9f0fe;
      margin-bottom: 16px;
      padding: 16px;
    }

    .cbt-q-block h4 {
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .cbt-opt-row {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cbt-opt-row input[type="radio"] {
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .cbt-opt-row label {
      font-weight: 500;
      cursor: pointer;
      flex: 1;
    }

    .cbt-submit-btn {
      background: linear-gradient(90deg, #10b981, #059669);
      color: #fff;
      padding: 12px 28px;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1.05em;
      border: none;
      transition: all 0.12s ease;
      cursor: pointer;
    }

    .cbt-submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .cbt-submit-btn:disabled {
      background: #c9e8df;
      color: #444;
      cursor: not-allowed;
    }

    .cbt-feedback {
      font-weight: bold;
      color: #159d5e;
      padding: 10px 0 0 0;
      font-size: 1.1em;
    }

    .cbt-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      font-weight: bold;
      font-size: 1.1em;
      gap: 12px;
      margin: 20px 0;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #eef3ff;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.12s ease;
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
    }

    .file-input {
      display: none;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.12s ease;
    }

    .file-label:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    /* Status Messages */
    .status-message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .status-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status-warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }

    .status-info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-state-title {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1.5px solid #eef3ff;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.12s ease;
    }

    .filter-btn.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border-color: var(--accent);
    }

    .filter-btn:hover {
      border-color: var(--accent);
    }

    /* Accessibility */
    .nav a:focus {
      outline: 3px solid rgba(99, 102, 241, 0.18);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .btn:focus {
      outline: 3px solid rgba(99, 102, 241, 0.12);
      outline-offset: 3px;
    }

    /* Helper Classes */
    .text-muted {
      color: var(--muted);
    }

    .text-success {
      color: #18ba89;
    }

    .text-danger {
      color: #e74c3c;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .main {
        padding: 20px 13px;
      }
    }

    @media (max-width: 980px) {
      .topbar .hamburger {
        display: inline-flex;
      }
    }

    @media (max-width: 720px) {
      :root {
        --sidebar-w: 86vw;
      }

      .sidebar {
        transform: translateX(-110%);
        position: fixed;
        width: var(--sidebar-w);
        min-width: var(--sidebar-w);
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 0 24px 48px rgba(2, 6, 23, 0.5);
      }

      .overlay {
        display: none;
      }

      .overlay.visible {
        display: block;
      }

      body.no-scroll {
        overflow: hidden;
        height: 100vh;
        touch-action: none;
      }

      .main {
        margin-left: 0;
        padding: 20px 14px;
        padding-top: 80px;
        max-width: 100vw;
      }

      .topbar {
        left: 0;
        width: 100vw;
        padding: 10px 12px;
        min-height: 56px;
      }

      .card {
        padding: 16px;
      }

      .modal-content {
        width: 98vw;
      }

      .cbt-modal {
        padding: 16px;
      }
    }

    @media (max-width: 480px) {
      .main {
        padding: 20px 2vw;
        padding-top: 80px;
      }

      .topbar {
        padding: 10px 2vw;
      }

      .card {
        padding: 12px;
      }

      .modal-header {
        padding: 16px;
      }

      .modal-body {
        padding: 16px;
      }

      .filters {
        flex-direction: column;
      }

      .filter-btn {
        width: 100%;
      }

      table {
        font-size: 0.85rem;
      }

      th, td {
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- Overlay -->
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation" role="navigation">
      <div class="brand" aria-hidden="false">
        <img src="mainlogo.png" alt="Logo">
        <div>
          <div class="title">Gold and Linc Schools</div>
          <div class="subtitle" id="schoolSubtitle">Gold & Linc Schools</div>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Primary">
        <a href="student-dashboard.html" data-section="home">🏠 Home</a>
        <a href="student-dashboard.html" data-section="courses">📘 My Courses</a>
        <a href="assignments.html" data-section="assignments" class="active">📝 Assignments</a>
        <a href="student-dashboard.html" data-section="grades">📊 Grades</a>
        <a href="student-dashboard.html" data-section="timetable">⏰ Timetable</a>
        <a href="student-dashboard.html" data-section="messages">✉️ Messages</a>
        <a href="student-dashboard.html" data-section="resources">📂 Resources</a>
        <a href="student-dashboard.html" data-section="settings">⚙️ Settings</a>
      </nav>

      <div class="spacer" aria-hidden="true"></div>

      <div class="profile" role="region" aria-label="Student profile">
        <img src="avatar.jpg" alt="Student avatar" id="studentAvatar">
        <div>
          <div class="name" id="studentName"></div>
          <div class="muted" id="studentClass">Student</div>
        </div>
      </div>
    </aside>

    <!-- Fixed Topbar -->
    <div class="topbar" id="fixedTopbar">
      <div style="display:flex; gap:12px; align-items:center;">
        <button class="hamburger" id="hamburger" aria-label="Open menu">☰</button>
        <div>
          <div class="page-title" id="pageTitle">My Assignments</div>
        </div>
      </div>

      <div style="display:flex; gap:12px; align-items:center;">
        <img src="avatar.jpg" alt="You" style="width:44px;height:44px;border-radius:8px;object-fit:cover;border:2px solid #fff;" id="topbarAvatar">
      </div>
    </div>

    <!-- Main Content -->
    <main class="main" id="main" role="main">
      <!-- Assignments Card -->
      <div class="card">
        <div class="card-header">
          <i class="fa fa-file-alt"></i>
          My Assignments
        </div>

        <!-- Filters -->
        <div class="filters">
          <button class="filter-btn active" onclick="filterAssignments('all')">All</button>
          <button class="filter-btn" onclick="filterAssignments('pending')">Pending</button>
          <button class="filter-btn" onclick="filterAssignments('submitted')">Submitted</button>
          <button class="filter-btn" onclick="filterAssignments('reviewed')">Reviewed</button>
          <button class="filter-btn" onclick="filterAssignments('overdue')">Overdue</button>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <table id="assignmentsTable">
            <thead>
              <tr>
                <th>Title</th>
                <th>Subject</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Score</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="assignmentsTableBody">
              <tr>
                <td colspan="6" style="text-align:center; padding:40px;">
                  <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <div class="empty-state-title">Loading assignments...</div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Assignment Details Modal -->
  <div id="assignmentModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Assignment Details</h2>
        <button type="button" class="modal-close" onclick="closeAssignmentModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Subject</label>
          <div id="modalSubject" style="color: var(--text-muted);"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Due Date</label>
          <div id="modalDue" class="text-muted"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <div id="modalDescription" style="color: var(--text-muted); line-height: 1.6;"></div>
        </div>
        <div id="modalSubmissionStatus" class="form-group"></div>
        <div id="modalUploadSection" class="form-group"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn ghost" onclick="closeAssignmentModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- CBT/Mock Modal -->
  <div id="cbtModalBg" class="modal">
    <div class="cbt-modal" id="cbtModal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div class="modal-title" id="cbtModalHeader"></div>
        <button class="modal-close" onclick="closeCbtModal()">&times;</button>
      </div>
      <div class="text-center mb-2">
        <span class="cbt-timer" id="cbtTimer"></span>
      </div>
      <form id="cbtQuizForm">
        <div id="cbtQuestionsBlock"></div>
        <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center;">
          <button type="submit" class="cbt-submit-btn" id="cbtSubmitBtn">Submit CBT</button>
          <div id="cbtFeedback" class="cbt-feedback"></div>
        </div>
      </form>
      <div id="cbtQuizLoader" class="cbt-loader" style="display:none;"><i class="fa fa-spinner fa-spin"></i> Loading CBT...</div>
    </div>
  </div>

  <script>
    // ============ API CONFIGURATION ============
    const API_BASE = "https://goldlincschools.onrender.com/api";
    const token = localStorage.getItem('studentToken') || localStorage.getItem('token') || "";

    // ============ STATE ============
    let allAssignments = [];
    let currentFilter = 'all';
    let cbtDuration = 30;
    let cbtQuestions = [];
    let cbtAnswers = [];
    let cbtTimerInterval = null;
    let cbtStartTime = null;

    // ============ INITIALIZATION ============
    document.addEventListener('DOMContentLoaded', () => {
      loadStudentInfo();
      loadAssignments();
      setupEventListeners();
    });

    // ============ LOAD STUDENT INFO ============
    async function loadStudentInfo() {
      try {
        const res = await fetch(`${API_BASE}/students/me`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Failed to load student info');
        const student = await res.json();
        
        document.getElementById('studentName').textContent = `${student.firstname} ${student.surname}`;
        document.getElementById('studentClass').textContent = student.class || 'Student';
        document.getElementById('studentAvatar').src = student.photo || 'avatar.jpg';
        document.getElementById('topbarAvatar').src = student.photo || 'avatar.jpg';
      } catch (err) {
        console.error('Error loading student info:', err);
      }
    }

    // ============ LOAD ASSIGNMENTS ============
    async function loadAssignments() {
      try {
        const res = await fetch(`${API_BASE}/assignments/me`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Failed to load assignments');
        allAssignments = await res.json();
        renderAssignmentsTable();
      } catch (err) {
        console.error('Error loading assignments:', err);
        document.getElementById('assignmentsTableBody').innerHTML = `
          <tr><td colspan="6" style="text-align:center; color:#e74c3c;">Failed to load assignments</td></tr>
        `;
      }
    }

    // ============ FILTER ASSIGNMENTS ============
    function filterAssignments(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderAssignmentsTable();
    }

    // ============ RENDER ASSIGNMENTS TABLE ============
    function renderAssignmentsTable() {
      const tableBody = document.getElementById('assignmentsTableBody');
      
      let filtered = allAssignments;
      if (currentFilter !== 'all') {
        filtered = allAssignments.filter(a => a.status.toLowerCase() === currentFilter.toLowerCase());
      }

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align:center; padding:40px;">
              <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <div class="empty-state-title">No assignments found</div>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filtered.map(assignment => `
        <tr>
          <td><strong>${assignment.title}</strong></td>
          <td>${assignment.subject?.name || '—'}</td>
          <td>${new Date(assignment.dueDate).toLocaleDateString()}</td>
          <td><span class="badge badge-${assignment.status.toLowerCase()}">${assignment.status}</span></td>
          <td>${assignment.score !== null && assignment.score !== undefined ? assignment.score : '—'}</td>
          <td>
            <button class="btn" onclick="openAssignmentModal(${JSON.stringify(assignment).replace(/"/g, '&quot;')})">
              View
            </button>
          </td>
        </tr>
      `).join('');
    }

    // ============ OPEN ASSIGNMENT MODAL ============
    function openAssignmentModal(assignment) {
      document.getElementById('modalTitle').textContent = assignment.title;
      document.getElementById('modalSubject').textContent = assignment.subject?.name || '—';
      document.getElementById('modalDue').textContent = new Date(assignment.dueDate).toLocaleDateString();
      
      // For QUESTION_BANK type, show description and load questions button
      if (assignment.type === 'QUESTION_BANK') {
        document.getElementById('modalDescription').innerHTML = `
          <p style="margin-bottom: 16px;">${assignment.description || 'Click "Take Quiz" to start the exam.'}</p>
          <button class="btn" onclick="launchCBTQuiz('${assignment._id}', '${assignment.title}')">
            📝 Take Quiz
          </button>
        `;
      } else {
        // Standard assignment
        document.getElementById('modalDescription').textContent = assignment.description || 'No description provided';
        
        let statusHTML = '';
        if (assignment.submitted) {
          statusHTML = `
            <div class="status-message status-success">
              ✓ Submitted on ${new Date(assignment.submittedAt).toLocaleDateString()}
            </div>
          `;
        } else {
          statusHTML = `
            <div class="status-message status-warning">
              ⚠ Not yet submitted
            </div>
          `;
        }
        document.getElementById('modalSubmissionStatus').innerHTML = statusHTML;

        // Upload section
        let uploadHTML = '';
        if (!assignment.submitted) {
          uploadHTML = `
            <div>
              <label class="form-label">Submit Work</label>
              <div style="display: flex; gap: 10px; margin-top: 10px;">
                <div class="file-input-wrapper">
                  <input type="file" id="assignmentFile" class="file-input">
                  <label for="assignmentFile" class="file-label">
                    <i class="fa fa-upload"></i> Choose File
                  </label>
                </div>
                <button class="btn success" onclick="submitAssignment('${assignment._id}')">
                  Submit Assignment
                </button>
              </div>
            </div>
          `;
        }
        document.getElementById('modalUploadSection').innerHTML = uploadHTML;
      }

      document.getElementById('assignmentModal').classList.add('active');
    }

    // ============ SUBMIT ASSIGNMENT ============
    async function submitAssignment(assignmentId) {
      const fileInput = document.getElementById('assignmentFile');
      if (!fileInput.files.length) {
        alert('Please select a file to submit');
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        const res = await fetch(`${API_BASE}/assignments/${assignmentId}/submit`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });
        
        if (!res.ok) throw new Error('Submission failed');
        
        alert('Assignment submitted successfully!');
        closeAssignmentModal();
        loadAssignments();
      } catch (err) {
        console.error('Error submitting assignment:', err);
        alert('Failed to submit assignment');
      }
    }

    // ============ LAUNCH CBT QUIZ ============
    async function launchCBTQuiz(assignmentId, assignmentTitle) {
      document.getElementById('cbtModalHeader').textContent = assignmentTitle;
      document.getElementById('cbtModalBg').classList.add('active');
      document.getElementById('cbtQuizLoader').style.display = 'flex';
      document.getElementById('cbtQuestionsBlock').innerHTML = '';

      await loadCBTQuestions(assignmentId);
    }

    // ============ LOAD CBT QUESTIONS ============
    async function loadCBTQuestions(assignmentId) {
      try {
        const res = await fetch(`${API_BASE}/assignments/${assignmentId}/questions`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
          throw new Error('Failed to load questions');
        }

        const data = await res.json();
        const questions = data.questions || [];

        if (!questions || questions.length === 0) {
          document.getElementById('cbtQuizLoader').innerHTML = `<span style="color: #e74c3c;">No questions found for this assignment.</span>`;
          return;
        }

        cbtDuration = data.duration || 30;
        cbtQuestions = questions;
        cbtAnswers = Array(cbtQuestions.length).fill(null);

        document.getElementById('cbtQuizLoader').style.display = 'none';
        renderCBTQuiz();
        startCBTTimer();
      } catch (error) {
        console.error('Error loading questions:', error);
        document.getElementById('cbtQuizLoader').innerHTML = `<span style="color: #e74c3c;">Failed to load questions: ${error.message}</span>`;
      }
    }

    // ============ RENDER CBT QUIZ ============
    function renderCBTQuiz() {
      const container = document.getElementById('cbtQuestionsBlock');
      container.innerHTML = '';

      cbtQuestions.forEach((q, qIndex) => {
        const block = document.createElement('div');
        block.className = 'cbt-q-block';
        
        let optionsHTML = '';
        if (q.options && Array.isArray(q.options)) {
          q.options.forEach((option, optIndex) => {
            const optionText = typeof option === 'string' ? option : (option.value || option.text || '');
            optionsHTML += `
              <div class="cbt-opt-row">
                <input 
                  type="radio" 
                  name="question${qIndex}" 
                  value="${optIndex}" 
                  id="opt${qIndex}_${optIndex}"
                  ${cbtAnswers[qIndex] === optIndex ? 'checked' : ''}
                  onchange="cbtAnswers[${qIndex}] = ${optIndex}">
                <label for="opt${qIndex}_${optIndex}">
                  ${String.fromCharCode(65 + optIndex)}) ${optionText}
                </label>
              </div>
            `;
          });
        }

        block.innerHTML = `
          <h4>Question ${qIndex + 1}: ${q.text || 'Question'}</h4>
          ${optionsHTML}
        `;
        container.appendChild(block);
      });
    }

    // ============ START CBT TIMER ============
    function startCBTTimer() {
      cbtStartTime = Date.now();
      updateCBTTimer();
      cbtTimerInterval = setInterval(updateCBTTimer, 1000);
    }

    // ============ UPDATE CBT TIMER ============
    function updateCBTTimer() {
      const elapsed = Math.floor((Date.now() - cbtStartTime) / 1000);
      const remaining = Math.max(0, cbtDuration * 60 - elapsed);
      
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;
      
      document.getElementById('cbtTimer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      if (remaining <= 0) {
        clearInterval(cbtTimerInterval);
        submitCBTAnswers();
      }
    }

    // ============ SUBMIT CBT ANSWERS ============
    async function submitCBTAnswers() {
      // This would typically submit to a results endpoint
      closeCbtModal();
      alert('Quiz submitted!');
      loadAssignments();
    }

    // ============ CLOSE MODALS ============
    function closeAssignmentModal() {
      document.getElementById('assignmentModal').classList.remove('active');
    }

    function closeCbtModal() {
      document.getElementById('cbtModalBg').classList.remove('active');
      if (cbtTimerInterval) clearInterval(cbtTimerInterval);
    }

    // ============ EVENT LISTENERS ============
    function setupEventListeners() {
      document.getElementById('hamburger').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('visible');
      });

      document.getElementById('overlay').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('visible');
      });

      document.getElementById('cbtQuizForm').addEventListener('submit', (e) => {
        e.preventDefault();
        submitCBTAnswers();
      });
    }
  </script>
</body>
</html>
