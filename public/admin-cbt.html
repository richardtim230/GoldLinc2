<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CBT Admin Dashboard | Gold and Linc Schools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400,600,700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <!-- PDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-0: #f6f8ff;
      --bg-1: #eef2ff;
      --accent: #0f172a;
      --accent-2: #1e40af;
      --muted: #6b7280;
      --card-bg: #ffffff;
      --sidebar-w: 300px;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-0), var(--bg-1));
      -webkit-font-smoothing: antialiased;
      color: #07102a;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      display: flex;
      min-height: 100vh;
      align-items: stretch;
    }

    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: linear-gradient(180deg, #07102a 0%, #0b3b82 100%);
      color: #fff;
      padding: 20px 16px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      box-shadow: 4px 0 28px rgba(2, 11, 24, 0.12);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      border: 3px solid rgba(255, 224, 102, 0.12);
      background: #fff;
    }

    .brand .title {
      font-weight: 800;
      font-size: 1.05rem;
      color: #ffe066;
    }

    .brand .subtitle {
      font-size: 0.85rem;
      color: #b0c4ff;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
      flex: 1;
    }

    .nav a, .nav-submenu-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.98rem;
      color: #e6eefc;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav a.active,
    .nav a:hover,
    .nav-submenu-toggle:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #ffe066;
    }

    .nav-submenu {
      display: none;
      flex-direction: column;
      gap: 4px;
      margin-left: 20px;
      margin-top: 4px;
    }

    .nav-submenu.active {
      display: flex;
    }

    .nav-submenu a {
      padding: 8px 10px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #b0c4ff;
    }

    .nav-submenu a:hover,
    .nav-submenu a.active {
      background: rgba(255, 255, 255, 0.08);
      color: #ffe066;
    }

    .submenu-toggle-icon {
      margin-left: auto;
      transition: transform 0.2s;
    }

    .nav-submenu-toggle.expanded .submenu-toggle-icon {
      transform: rotate(180deg);
    }

    .topbar {
      position: fixed;
      left: var(--sidebar-w);
      top: 0;
      width: calc(100% - var(--sidebar-w));
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid #eef3ff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    .main {
      margin-left: var(--sidebar-w);
      padding: 20px;
      flex: 1;
      min-height: 100vh;
      padding-top: 80px;
      overflow-y: auto;
    }

    .page-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-2);
    }

    .flex {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .muted-small {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin-left: 8px;
      padding: 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .cbt-btn {
      background: var(--accent-2);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cbt-btn:hover {
      background: #1438a0;
    }

    .content-area {
      flex: 1;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      padding: 2em;
      min-width: 0;
      min-height: 600px;
      border: 1px solid #eef3ff;
    }

    .ql-editor {
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
    }

    .ql-toolbar.ql-snow {
      border-radius: 0.5em 0.5em 0 0;
    }

    .ql-container.ql-snow {
      border-radius: 0 0 0.5em 0.5em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    table thead {
      background: #f6f8fa;
      color: var(--accent-2);
    }

    table th, table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eef3ff;
    }

    table tbody tr:hover {
      background: #f9fafd;
    }

    table button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    table button:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #e0e6eb;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95em;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 16px;
    }

    #pageSpinnerOverlay {
      position: fixed;
      z-index: 99999;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s;
    }

    .spinner {
      border: 6px solid #ddeaff;
      border-top: 6px solid #2647a6;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spinner-spin 1s linear infinite;
    }

    .results-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      py: 10;
      gap: 10px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
      accent-color: #1e40af;
    }

    .option-checkbox {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      background: #ffffff;
    }

    .option-checkbox:hover {
      background: rgba(30, 64, 175, 0.08);
      border-color: rgba(30, 64, 175, 0.2);
    }

    .option-checkbox input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 0;
      cursor: pointer;
      accent-color: #1e40af;
      flex-shrink: 0;
    }

    .option-checkbox span {
      font-size: 15px;
      font-weight: 500;
      color: #0f172a;
      user-select: none;
    }

    .option-checkbox:has(input[type="checkbox"]:checked) {
      background: #e0e7ff;
      border-color: #1e40af;
    }

    .filters-section {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-input {
      flex: 1;
      min-width: 200px;
    }

    .filter-select {
      flex: 1;
      min-width: 150px;
    }

    .results-info {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #f0f4ff;
      border-radius: 6px;
      margin-bottom: 16px;
      color: var(--accent-2);
      font-weight: 600;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #eef3ff;
    }

    @keyframes spinner-spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      :root {
        --sidebar-w: 280px;
      }

      .sidebar {
        width: 280px;
        position: fixed;
        left: -280px;
        transition: left 0.3s ease;
      }

      .sidebar.active {
        left: 0;
      }

      .topbar {
        left: 0;
        width: 100%;
      }

      .main {
        margin-left: 0;
        padding: 14px;
        padding-top: 84px;
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 99;
      }

      .sidebar-overlay.active {
        display: block;
      }

      #sidebarToggle {
        display: flex !important;
        font-size: 24px;
      }

      .content-area {
        padding: 1.5em;
      }

      .filters-section {
        flex-direction: column;
      }

      .filter-input, .filter-select {
        min-width: 100%;
      }
    }

    @media (max-width: 600px) {
      .main {
        padding: 12px;
        padding-top: 80px;
      }

      .content-area {
        padding: 1em;
      }

      .page-title {
        font-size: 1rem;
      }

      .icon-btn {
        font-size: 16px;
        margin-left: 6px;
        padding: 6px;
      }

      .topbar {
        padding: 10px 12px;
      }
    }

    ::-webkit-scrollbar {
      width: 7px;
      background: #f4f8fc;
    }

    ::-webkit-scrollbar-thumb {
      background: #e2e7ee;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="pageSpinnerOverlay">
    <div class="spinner"></div>
  </div>

  <div class="app" id="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Admin navigation">
      <div class="brand">
        <img src="mainlogo.png" alt="Logo">
        <div>
          <div class="title">Gold and Linc Schools</div>
          <div class="subtitle">Admin Portal</div>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <a href="admin.html" class="nav-link">
          <span>🏠</span> Dashboard
        </a>
        <a href="admission.html" class="nav-link">
          <span>🎓</span> Admission
        </a>
        <a href="more.html" class="nav-link">
          <span>🌐</span> Multi-location
        </a>
        <a href="people.html" class="nav-link">
          <span>👥</span> People
        </a>
        <a href="academics.html" class="nav-link">
          <span>📚</span> Academics
        </a>
        
        <!-- CBT Configuration with submenu -->
        <button class="nav-submenu-toggle" id="cbtToggle">
          <span>💻</span> CBT Configuration
          <span class="submenu-toggle-icon">▼</span>
        </button>
        <div class="nav-submenu" id="cbtSubmenu">
          <a href="#" class="cbt-nav-link active" data-section="exams"><span>📋</span> Exams</a>
          <a href="#" class="cbt-nav-link" data-section="upload"><span>📤</span> Upload Exam</a>
          <a href="#" class="cbt-nav-link" data-section="schedule"><span>📅</span> Schedule Exam</a>
          <a href="#" class="cbt-nav-link" data-section="results"><span>📊</span> Results</a>
          <a href="#" class="cbt-nav-link" data-section="activity"><span>🕐</span> Student Activity</a>
        </div>

        <a href="results.html" class="nav-link">
          <span>📄</span> Results
        </a>
        <a href="finance.html" class="nav-link">
          <span>💰</span> Finance
        </a>
        <a href="adminfees.html" class="nav-link">
          <span>💳</span> Fees
        </a>
        <a href="adminpayment.html" class="nav-link">
          <span>💸</span> Payments
        </a>
        <a href="attendance.html" class="nav-link">
          <span>🗓️</span> Attendance
        </a>
        <a href="#" class="nav-link">
          <span>⚙️</span> Settings
        </a>
      </nav>

      <div class="muted-small" style="margin-top: auto;">
        Signed in as <span id="adminName">Admin</span>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- TOPBAR -->
    <div class="topbar" role="banner">
      <div class="flex">
        <button id="sidebarToggle" class="icon-btn" aria-label="Toggle Sidebar" style="display: none; font-size: 24px;">☰</button>
        <div class="page-title" id="pageTitle">CBT Admin Dashboard</div>
      </div>
      <div class="flex">
        <button class="icon-btn" title="Notifications">🔔</button>
        <button class="icon-btn" title="Help">❓</button>
        <button class="icon-btn" title="Settings">⚙️</button>
        <button class="icon-btn" title="Search">🔍</button>
      </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="main" id="main" role="main" tabindex="-1">
      <div class="content-area" id="contentArea">
        <!-- Dynamic content goes here -->
      </div>
    </main>
  </div>

<script src="admin-cbt.js" defer></script>
</body>
</html>
