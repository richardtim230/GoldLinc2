        // ============ IMAGE UPLOAD HANDLERS ============
        function insertImageFromFile(fileInput, target) {
            const file = fileInput.files[0];
            if (!file) return;

            // Simple base64 conversion for demo - in production use proper file upload
            const reader = new FileReader();
            reader.onload = (e) => {
                const imageUrl = e.target.result;
                insertImageToQuill(target, imageUrl);
                fileInput.value = ''; // Reset input
            };
            reader.readAsDataURL(file);
        }

        function insertImageFromUrl(target) {
            const urlInput = document.getElementById(`${target}ImageUrl`);
            const imageUrl = urlInput.value.trim();
            if (!imageUrl) {
                alert('Please enter an image URL');
                return;
            }
            insertImageToQuill(target, imageUrl);
            urlInput.value = '';
        }

        function insertImageToQuill(target, imageUrl) {
            let quillInstance;
            if (target === 'stem') {
                quillInstance = stemQuillInstance;
            } else if (target === 'explanation') {
                quillInstance = explanationQuillInstance;
            } else if (target === 'option') {
                // For options, get the currently focused quill
                const optionDivs = document.querySelectorAll('#modalOptionsWrapper .option-editor-container');
                if (optionDivs.length > 0) {
                    const lastOptionDiv = optionDivs[optionDivs.length - 1];
                    const quillDiv = lastOptionDiv.querySelector('.quill-option-editor');
                    // Find corresponding quill instance
                    Object.values(optionQuillRegistry).forEach(item => {
                        if (item.quill && item.quill.root === quillDiv) {
                            quillInstance = item.quill;
                        }
                    });
                }
            }

            if (quillInstance) {
                const range = quillInstance.getSelection(true);
                quillInstance.insertEmbed(range.index, 'image', imageUrl);
                quillInstance.setSelection(range.index + 1);
            }
        }

            try {

                return await res.json();
            } catch (e) {
                console.error('Error fetching teacher profile:', e);

// 2. MODAL CONTROLLER ENGINE
// ==========================================
function showCustomModal({ title, message, type = 'confirm', icon = '❓' }) {
    return new Promise((resolve) => {
        const modal = document.getElementById('customModal');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMessage');
        const iconEl = document.getElementById('modalIcon');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        titleEl.textContent = title;
        msgEl.textContent = message;
        iconEl.textContent = icon;

        if (type === 'alert') {
            cancelBtn.style.display = 'none';
            confirmBtn.textContent = 'OK';
        } else {
            cancelBtn.style.display = 'inline-block';
            confirmBtn.textContent = 'Confirm';
        }

        modal.classList.remove('hidden');

        function close(result) {
            modal.classList.add('hidden');
            confirmBtn.removeEventListener('click', onConfirm);
            cancelBtn.removeEventListener('click', onCancel);
            resolve(result);
        }

        function onConfirm() { close(true); }
        function onCancel() { close(false); }

        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
    });
}

        document.body.appendChild(modal);
        return;
    }

    // Step 3: Collection already has class/subject, proceed with conversion
    await proceedWithConversion(collectionId);
}

// Helper function to proceed after class/subject selection
window.proceedWithPush = async function(collectionId) {
    const classSelector = document.getElementById('pushClassSelector');
    const subjectSelector = document.getElementById('pushSubjectSelector');
    
    const selectedClassId = classSelector.value;
    const selectedSubjectId = subjectSelector.value;
    
    if (!selectedClassId || !selectedSubjectId) {
        alert('Please select both class and subject');
        return;
    }

    // Update collection with class and subject
    try {
        const updateRes = await fetch(
            `${API_BASE_URL}/api/teachers/${encodeURIComponent(teacher.id)}/collections/${collectionId}`,
            {
                method: 'PATCH',
                headers: authHeaders(),
                body: JSON.stringify({
                    class: selectedClassId,
                    subject: selectedSubjectId
                })
            }
        );

        if (!updateRes.ok) throw new Error('Failed to assign class and subject');

        // Remove modal
        const modal = document.getElementById('pushCollectionModal');
        if (modal) modal.remove();

        // Proceed with conversion
        await proceedWithConversion(collectionId);
    } catch (err) {
        console.error('Error updating collection:', err);
        alert('Failed to assign class/subject: ' + err.message);
    }
};

// Main conversion function
async function proceedWithConversion(collectionId) {
    // Step 1: Confirm action
    const confirmed = await showCustomModal({
        title: 'Push Collection to CBT?',
        message: 'This will create a new CBT document that can be pushed to students.\n\nThis action cannot be undone.',
        icon: '📤'
    });

    if (!confirmed) return;

    try {
        // Step 2: Convert collection to CBT
        const convertRes = await fetch(
            `${API_BASE_URL}/api/teachers/${encodeURIComponent(teacher.id)}/collections/${collectionId}/convert-to-cbt`,
            {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({})
            }
        );

        if (!convertRes.ok) throw new Error('Failed to convert collection to CBT');
        const convertData = await convertRes.json();
        const cbtId = convertData.cbtId;

        // Step 3: Push the CBT
        const pushRes = await fetch(
            `${API_BASE_URL}/api/teachers/${encodeURIComponent(teacher.id)}/cbt/push`,
            {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({ cbtIds: [cbtId] })
            }
        );

        if (!pushRes.ok) throw new Error('Failed to push to exam');
        const pushData = await pushRes.json();
        
        // Success!
        await showCustomModal({
            title: 'Success! ✅',
            message: `Collection successfully converted and pushed to CBT Exam!\n\nPushed: ${pushData.pushed.length} CBT(s)\n\nStudents can now access this exam.`,
            type: 'alert',
            icon: '✅'
        });
        
        // Refresh
        assessmentDatabase = await fetchUnifiedQuestionBank();
        renderCollections();
    } catch (err) {
        console.error('Error during conversion:', err);
        await showCustomModal({
            title: 'Conversion Failed ❌',
            message: err.message,
            type: 'alert',
            icon: '❌'
        });
    }
}

        function getStandingBadge(score) {
            if (score >= 75) return { text: "A1 Excellent", class: "bg-emerald-100 text-emerald-800 border-emerald-200" };
            if (score >= 70) return { text: "B2 Very Good", class: "bg-emerald-50 text-emerald-700 border-emerald-100" };
            if (score >= 65) return { text: "B3 Good", class: "bg-teal-50 text-teal-700 border-teal-100" };
            if (score >= 60) return { text: "C4 Credit", class: "bg-blue-50 text-blue-700 border-blue-100" };
            return { text: "F9 Fail", class: "bg-rose-100 text-rose-800 border-rose-200" };
        }

        function calculateRowTotal(inputElement) {
            const row = inputElement.closest('tr');
            const ca1 = parseInt(row.querySelector('.ca1-input').value) || 0;
            const ca2 = parseInt(row.querySelector('.ca2-input').value) || 0;
            const exam = parseInt(row.querySelector('.exam-input').value) || 0;
            const cumulativeTotal = ca1 + ca2 + exam;
            
            row.querySelector('.total-span').innerText = cumulativeTotal;
            
            const badgeElement = row.querySelector('.standing-badge');
            const state = getStandingBadge(cumulativeTotal);
            badgeElement.className = `standing-badge inline-block text-[10px] font-bold px-2 py-0.5 rounded border text-center whitespace-nowrap min-w-[76px] ${state.class}`;
            badgeElement.innerText = state.text;
            
            updateProgressMetrics();
        }

        function updateProgressMetrics() {
            const rows = document.getElementById('gradebookTableBody').children;
            const totalStudents = rows.length;
            const totalExpectedCells = totalStudents * 3;
            let completedCells = 0;

            for (let row of rows) {
                const ca1Val = row.querySelector('.ca1-input').value;
                const ca2Val = row.querySelector('.ca2-input').value;
                const examVal = row.querySelector('.exam-input').value;

                if (ca1Val) completedCells++;
                if (ca2Val) completedCells++;
                if (examVal) completedCells++;
            }

            const percentComplete = totalExpectedCells > 0 ? Math.round((completedCells / totalExpectedCells) * 100) : 0;
            document.getElementById('progressBarFill').style.width = percentComplete + '%';
            document.getElementById('progressStatsCount').textContent = `${completedCells} / ${totalExpectedCells}`;
            document.getElementById('progressStatsLeft').textContent = `${totalExpectedCells - completedCells} Cells Left`;
        }

            document.querySelectorAll('#lmsMenu button').forEach(btn => {
                btn.classList.remove('sidebar-btn-active');
                btn.classList.add('sidebar-btn-inactive');
            });
            
            const activeBtn = document.getElementById(`btn-${panelName}`);
            if (activeBtn) {
                activeBtn.classList.add('sidebar-btn-active');
                activeBtn.classList.remove('sidebar-btn-inactive');
            }
            
            // Close bottom drawer on mobile
            closeBottomNav();
        }

        function openBottomNav() {
            const overlay = document.getElementById('bottomDrawerOverlay');
            const card = document.getElementById('bottomDrawerCard');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.add('opacity-100');
                card.classList.add('translate-y-0');
                card.classList.remove('translate-y-full');
            }, 10);
        }

        function closeBottomNav(event) {
            if (event && !event.target.id === 'bottomDrawerOverlay') return;
            
            const overlay = document.getElementById('bottomDrawerOverlay');
            const card = document.getElementById('bottomDrawerCard');
            overlay.classList.remove('opacity-100');
            card.classList.add('translate-y-full');
            card.classList.remove('translate-y-0');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }
